<!DOCTYPE html>
<html>
<head>
    <title>CamMap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="logo1.png">
</head>
<body>

   <div class="header">

    <div class="header-content">

        <h1 class="logo-title">

           <img src="logo1.png" alt="CamMap Logo" class="logo">

           <span>CamMap</span>

        </h1>

        <p class="subtitle">
            EMEA College Campus Navigation System
        </p>

        <small>
            Navigate your campus with ease
        </small>

    </div>

   </div>

    <div class="search-box">
        

<div class="select-container">

    <div class="select-box">
        <label for="start"><i class="bi bi-geo-alt-fill"></i> From</label>
        <select id="start">
            <option value="">Select Starting Point</option>

            <option>Main Gate</option>
            <option>Main Block</option>
            <option>Economics Department</option>
            <option>Language Department</option>
            <option>West Asian Studies Department</option>
            <option>Principal Room</option>
            <option>College Office</option>
            <option>Computer Science Department</option>
            <option>English Department</option>
            <option>Microbiology Department</option>
            <option>Seminar Hall</option>
            <option>Biochemistry Department</option>
            <option>Biotechnology Department</option>
            <option>Commerce Department</option>
            <option>Business Administration Department</option>
            <option>RUSA Building</option>
            <option>Mathematics & Physics Department</option>
            <option>BVoc Block</option>
            <option>Library</option>
            <option>Library Building</option>
            <option>Administrative Office</option>
            <option>Canteen</option>
            <option>Prayer Hall</option>
            <option>Cooperative Store</option>
            <option>Basketball Court</option>
            <option>Sports Hostel</option>
            <option>NSS/NCC Office</option>
            <option>Audio Visual Theater</option>
            <option>Bamboo Lake</option>
            <option>Boys Washroom</option>
            <option>Auditorium</option>
            <option>EMEA Training College</option>
            <option>Mahogany Park</option>
            <option>NCC Ground</option>
            <option>Ladies Hostel</option>
        </select>
    </div>

    <div class="select-box">
        <label for="destination"><i class="bi bi-flag-fill"></i> To</label>
        <select id="destination">
            <option value="">Select Destination</option>

            <option>Main Gate</option>
            <option>Main Block</option>
            <option>Economics Department</option>
            <option>Language Department</option>
            <option>West Asian Studies Department</option>
            <option>Principal Room</option>
            <option>College Office</option>
            <option>Computer Science Department</option>
            <option>English Department</option>
            <option>Microbiology Department</option>
            <option>Seminar Hall</option>
            <option>Biochemistry Department</option>
            <option>Biotechnology Department</option>
            <option>Commerce Department</option>
            <option>Business Administration Department</option>
            <option>RUSA Building</option>
            <option>Mathematics & Physics Department</option>
            <option>BVoc Block</option>
            <option>Library</option>
            <option>Library Building</option>
            <option>Administrative Office</option>
            <option>Canteen</option>
            <option>Prayer Hall</option>
            <option>Cooperative Store</option>
            <option>Basketball Court</option>
            <option>Sports Hostel</option>
            <option>NSS/NCC Office</option>
            <option>Audio Visual Theater</option>
            <option>Bamboo Lake</option>
            <option>Boys Washroom</option>
            <option>Auditorium</option>
            <option>EMEA Training College</option>
            <option>Mahogany Park</option>
            <option>NCC Ground</option>
            <option>Ladies Hostel</option>
        </select>
    </div>

</div>

<div class="button-area">
    <button><i class="bi bi-search"></i>  Find Route</button>
</div>
</div>
    

    <div class="map-area">
    <img src="final map.png" id="campusMap">

    <svg id="routeLayer"></svg>

    <div class="marker" id="mainBlock" title="Main Block"></div>

    <div class="marker" id="commerceBlock" title="Commerce Block"></div>

    <div class="marker" id="rusaBlock" title="RUSA Building"></div>

    <div class="marker" id="bvocBlock" title="BVoc Block"></div>
</div>

    <div class="result-box">

    <div class="card shadow-sm border-0">

        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">
                <i class="bi bi-map-fill"></i> Route Details
            </h4>
        </div>

        <div class="card-body">

            <div class="row">

                <div class="col-md-6 mb-3">
                    <div class="info-box from-box p-3 h-100">

                        <small class="text-muted">
                            <i class="bi bi-geo-alt-fill text-success"></i>
                            From
                        </small>

                        <h5 id="fromResult" class="fw-bold text-success">-</h5>

                    </div>
                </div>

                <div class="col-md-6 mb-3">
                    <div class="info-box to-box p-3 h-100">

                        <small class="text-muted">
                            <i class="bi bi-flag-fill text-danger"></i>
                            Destination
                        </small>

                        <h5 id="toResult" class="fw-bold text-danger">-</h5>

                    </div>
                </div>

            </div>

            <div class="row">

                <div class="col-md-4 mb-3">
                    <div class="info-box waypoint-box p-3 text-center">

                        <i class="bi bi-signpost-fill fs-3 text-warning"></i>

                        <h6 class="mt-2">Junctions</h6>

                        <h5 id="junctionResult">0</h5>

                    </div>
                </div>

                <div class="col-md-4 mb-3">
                    <div class="info-box time-box p-3 text-center">

                        <i class="bi bi-clock-fill fs-3 text-primary"></i>

                        <h6 class="mt-2">Time</h6>

                        <h5 id="timeResult">--</h5>

                    </div>
                </div>

                <div class="col-md-4 mb-3">
                    <div class="info-box status-box p-3 text-center">

                        <i class="bi bi-check-circle-fill fs-3 text-success"></i>

                        <h6 class="mt-2">Status</h6>

                        <h5 id="statusResult">Ready</h5>

                    </div>
                </div>

            </div>

        </div>

    </div>

</div>
<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
